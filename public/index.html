<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kento RAW Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 15px;
            border: 2px solid #ff8c00;
        }
        header h1 { color: #ff8c00; font-size: 2rem; margin-bottom: 5px; }
        header p { color: #666; font-size: 0.9rem; }
        .card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
        }
        .card-title { color: #ff8c00; font-size: 1.1rem; margin-bottom: 15px; }
        textarea {
            width: 100%;
            height: 250px;
            background: #0a0a0a;
            color: #ff8c00;
            border: 2px solid #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
            line-height: 1.6;
        }
        textarea:focus { border-color: #ff8c00; }
        .char-count { text-align: right; color: #666; font-size: 12px; margin-top: 5px; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-row button {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            background: #2a2a2a; color: #fff;
        }
        .btn-row button:hover { background: #3a3a3a; }
        .option-row {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 15px; padding: 12px;
            background: #0a0a0a; border-radius: 8px; border: 1px solid #2a2a2a;
        }
        .option-row input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: #ff8c00; cursor: pointer;
        }
        .option-row label { color: #ccc; font-size: 14px; cursor: pointer; }
        .filename-input {
            width: 100%; padding: 12px; background: #0a0a0a; color: #fff;
            border: 2px solid #2a2a2a; border-radius: 8px; font-size: 14px;
            outline: none; margin-top: 8px;
        }
        .filename-input:focus { border-color: #ff8c00; }
        .generate-btn {
            width: 100%; padding: 16px; background: #ff8c00; color: #0a0a0a;
            border: none; border-radius: 10px; font-size: 16px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .generate-btn:hover { background: #ffa500; }
        .result {
            background: #0a0a0a; border-radius: 10px; padding: 20px;
            display: none; border: 1px solid #2a2a2a; margin-top: 15px;
        }
        .result.show { display: block; }
        .result-header { color: #00cc00; font-weight: bold; margin-bottom: 10px; }
        .url {
            color: #00cc00; word-break: break-all; font-family: monospace;
            font-size: 13px; padding: 12px; background: #000;
            border-radius: 6px; margin-bottom: 10px;
        }
        .result-actions { display: flex; gap: 10px; }
        .result-actions button {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        .btn-copy { background: #ff8c00; color: #0a0a0a; }
        .btn-open { background: #0088cc; color: #fff; }
        .status {
            padding: 12px; border-radius: 8px; margin-top: 15px;
            display: none; text-align: center; font-size: 14px;
        }
        .status.show { display: block; }
        .status.success { background: #004400; color: #00cc00; }
        .status.error { background: #440000; color: #ff4444; }
        .footer { text-align: center; color: #333; font-size: 12px; margin-top: 30px; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🔥 Kento RAW Generator</h1>
        <p>LuaやテキストをRaw形式で扱うジェネレーター</p>
    </header>

    <div class="card">
        <div class="card-title">📝 INPUT</div>
        <textarea id="codeInput" placeholder="コード / テキストを入力...">print("Hello Kento!")</textarea>
        <div class="char-count"><span id="charCount">0</span> 文字</div>
        <div class="btn-row">
            <button id="pasteBtn">📋 貼り付け</button>
            <button id="clearBtn">🗑 クリア</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">⚙️ OPTIONS</div>
        
        <div class="option-row">
            <input type="checkbox" id="wrapLoadstring">
            <label for="wrapLoadstring">loadstring(game:HttpGet(""))() で囲う</label>
        </div>

        <div class="option-row" style="flex-direction: column; align-items: stretch;">
            <label style="color:#666;font-size:12px;margin-bottom:5px;">📁 ファイル名を指定（任意）</label>
            <input type="text" class="filename-input" id="filenameInput" placeholder="好きな数値を入力（8文字まで）">
        </div>
    </div>

    <button class="generate-btn" id="generateBtn">✨ RAWを生成する</button>

    <div class="result" id="result">
        <div class="result-header">✅ 生成完了</div>
        <p style="color:#666;font-size:13px;margin-bottom:10px;">生成したRawリンクです。コピーして利用できます。</p>
        <div class="url" id="resultUrl"></div>
        <div class="result-actions">
            <button class="btn-copy" id="copyBtn">📋 コピー</button>
            <button class="btn-open" id="openBtn">↗ Rawを開く</button>
        </div>
    </div>

    <div id="status" class="status"></div>

    <div class="footer">
        🔥 Kento RAW Generator · Supabase保存でデータは消えません
    </div>
</div>

<script>
let currentResult = '';
const codeInput = document.getElementById('codeInput');
const charCount = document.getElementById('charCount');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

codeInput.addEventListener('input', function() {
    charCount.textContent = codeInput.value.length;
});

document.getElementById('pasteBtn').addEventListener('click', async function() {
    try {
        const text = await navigator.clipboard.readText();
        codeInput.value = text;
        charCount.textContent = text.length;
        showStatus('✅ 貼り付けました', 'success');
    } catch (e) {
        showStatus('❌ 貼り付けできません。手動で貼り付けてください', 'error');
    }
});

document.getElementById('clearBtn').addEventListener('click', function() {
    if (confirm('クリアしますか？')) {
        codeInput.value = '';
        charCount.textContent = '0';
        resultEl.classList.remove('show');
        statusEl.className = 'status';
    }
});

document.getElementById('generateBtn').addEventListener('click', async function() {
    const code = codeInput.value;
    const customId = document.getElementById('filenameInput').value.trim();
    const wrapLoadstring = document.getElementById('wrapLoadstring').checked;

    if (!code.trim()) {
        showStatus('⚠️ コードを入力してください', 'error');
        return;
    }

    showStatus('⏳ 生成中...', 'info');

    try {
        const res = await fetch('/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ 
                code: code, 
                title: customId || 'Kento Script',
                customId: customId
            })
        });
        const data = await res.json();

        if (data.success) {
            const rawLink = data.raw;
            
            if (wrapLoadstring) {
                currentResult = 'loadstring(game:HttpGet("' + rawLink + '"))()';
                document.getElementById('resultUrl').textContent = currentResult;
            } else {
                currentResult = rawLink;
                document.getElementById('resultUrl').textContent = rawLink;
            }

            resultEl.classList.add('show');
            showStatus('✅ 生成完了！', 'success');
        } else {
            showStatus('❌ ' + data.error, 'error');
        }
    } catch(e) {
        showStatus('❌ ' + e.message, 'error');
    }
});

document.getElementById('copyBtn').addEventListener('click', function() {
    if (currentResult) {
        navigator.clipboard.writeText(currentResult);
        showStatus('✅ コピーしました！', 'success');
    }
});

document.getElementById('openBtn').addEventListener('click', function() {
    const url = document.getElementById('resultUrl').textContent;
    if (url) {
        const match = url.match(/https?:\/\/[^\s"]+/);
        if (match) {
            window.open(match[0], '_blank');
        } else {
            window.open(url, '_blank');
        }
    }
});

function showStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = 'status show ' + type;
    setTimeout(function() {
        if (statusEl.className.includes('show')) {
            statusEl.className = 'status';
        }
    }, 3000);
}

document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
        document.getElementById('generateBtn').click();
    }
});

charCount.textContent = codeInput.value.length;
</script>

</body>
</html>
